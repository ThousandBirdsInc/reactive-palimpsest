#
# kind cluster config for nested cgroup-v1 microVMs: IPv4-only networking (the
# kernel often has IPv6 disabled) and the cgroupfs kubelet driver to match the
# patched node image's containerd configuration.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    cgroupDriver: cgroupfs
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        cgroup-driver: cgroupfs
