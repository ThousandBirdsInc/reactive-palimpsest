name: palimpsest-dev

services:
  postgres:
    image: postgres:18
    container_name: palimpsest-dev-postgres
    environment:
      POSTGRES_DB: palimpsest_dev
      POSTGRES_USER: palimpsest_admin
      POSTGRES_PASSWORD: palimpsest_admin
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palimpsest_admin -d palimpsest_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  palimpsest:
    image: palimpsest:dev
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: palimpsest-dev-sync
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve", "/etc/palimpsest/palimpsest.toml"]
    ports:
      - "50051:50051"
      - "9090:9090"
    volumes:
      - ./palimpsest.toml:/etc/palimpsest/palimpsest.toml:ro

volumes:
  postgres-data:
