# Default values for palimpsest-paas.
#
# This chart deploys the managed-PaaS control plane and data-plane components
# onto Kubernetes. Managed customer databases are NOT created by this chart;
# the control plane provisions them at runtime as CloudNativePG `Cluster`
# resources (see `runtime.*` below and the RBAC granted in rbac.yaml).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# CloudNativePG operator subchart. Set enabled=false if the operator is already
# installed cluster-wide.
cloudnative-pg:
  enabled: true

# -----------------------------------------------------------------------------
# Control plane: the SQL-backed reconciliation + API service. It renders managed
# Postgres desired state into CloudNativePG manifests and applies them, so it
# needs both a metadata database and Kubernetes RBAC (see `rbac`).
# -----------------------------------------------------------------------------
controlPlane:
  image:
    repository: ghcr.io/thousandbirds/palimpsest-paas-control-plane
    tag: ""  # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  listenPort: 8088
  service:
    type: ClusterIP
    port: 8088
  # Envelope encryption for managed-Postgres role passwords. Provide a 32-byte
  # base64 key via an existing secret, or leave blank for the local-dev plaintext
  # provider (NOT for production).
  secretProvider: "local-dev"     # or "env-envelope"
  secretKeyRef: "control-plane-key"
  existingSecretEncryptionSecret: ""  # secret with PALIMPSEST_PAAS_SECRET_KEY_BASE64
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Runtime knobs that the control plane passes to the CloudNativePG renderer.
runtime:
  # Container image repository for managed PostgreSQL (major tag appended).
  postgresImageRepository: ghcr.io/cloudnative-pg/postgresql
  # StorageClass for managed-Postgres volumes ("" uses the cluster default).
  storageClass: ""
  # Each environment gets its own namespace (palimpsest-<environment_id>).
  namespacePerEnvironment: true
  # Namespace used when namespacePerEnvironment is false.
  defaultNamespace: ""  # defaults to the release namespace
  # Object store for WAL archiving + base backups ("" disables backups).
  backupObjectStoreBase: ""
  # Name of a Secret holding S3 credentials (ACCESS_KEY_ID / ACCESS_SECRET_KEY).
  backupCredentialsSecret: ""

# The control plane's own metadata database, run via CloudNativePG (dogfooding
# the same operator that backs customer databases).
controlPlaneDatabase:
  enabled: true
  instances: 1
  storageSize: 10Gi
  storageClass: ""
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  database: palimpsest_control
  owner: palimpsest_control

# Flyway migrations for the control-plane metadata database. Runs as a Helm
# hook Job before the control plane starts. The image must bundle the SQL under
# paas/control-plane/migrations (see the chart README).
migrations:
  enabled: true
  image:
    repository: ghcr.io/thousandbirds/palimpsest-paas-migrations
    tag: ""
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Gateway: hosted HTTP ingress + usage accounting for SyncDeployments.
# -----------------------------------------------------------------------------
gateway:
  enabled: true
  image:
    repository: ghcr.io/thousandbirds/palimpsest-paas-gateway
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  listenPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------------
# Database proxy: raw PostgreSQL TCP proxy for managed Postgres endpoints.
# -----------------------------------------------------------------------------
dbProxy:
  enabled: true
  image:
    repository: ghcr.io/thousandbirds/palimpsest-paas-gateway
    tag: ""
    pullPolicy: IfNotPresent
  command: ["db_proxy"]
  replicaCount: 2
  listenPort: 5432
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# -----------------------------------------------------------------------------
# Operator console (React UI).
# -----------------------------------------------------------------------------
ui:
  enabled: true
  image:
    repository: ghcr.io/thousandbirds/palimpsest-paas-ui
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  listenPort: 8090
  service:
    type: ClusterIP
    port: 80

# -----------------------------------------------------------------------------
# RBAC granting the control plane permission to manage CloudNativePG resources.
# -----------------------------------------------------------------------------
rbac:
  create: true
  # Cluster-scoped, so the control plane can manage Postgres in per-environment
  # namespaces it creates. Set false to restrict to the release namespace only.
  clusterWide: true

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
