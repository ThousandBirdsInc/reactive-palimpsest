{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "palimpsest-paas.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palimpsest-paas.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "palimpsest-paas.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            # The UI proxies /api to the control-plane service.
            - name: PALIMPSEST_PAAS_CONTROL_PLANE_URL
              value: http://{{ include "palimpsest-paas.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.listenPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "palimpsest-paas.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palimpsest-paas.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}
