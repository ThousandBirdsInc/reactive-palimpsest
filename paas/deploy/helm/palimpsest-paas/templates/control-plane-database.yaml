{{- if .Values.controlPlaneDatabase.enabled }}
# The control plane's metadata database, provided by CloudNativePG — the same
# operator that backs managed customer databases.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "palimpsest-paas.fullname" . }}-control-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palimpsest-paas.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.controlPlaneDatabase.instances }}
  imageName: {{ .Values.controlPlaneDatabase.imageName | quote }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.controlPlaneDatabase.storageSize | quote }}
    {{- with .Values.controlPlaneDatabase.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.controlPlaneDatabase.database | quote }}
      owner: {{ .Values.controlPlaneDatabase.owner | quote }}
  # CloudNativePG auto-generates the owner credentials Secret
  # "{{ include "palimpsest-paas.fullname" . }}-control-db-app" (keys: uri,
  # username, password, ...), which the control plane reads as DATABASE_URL.
{{- end }}
