{{- if .Values.migrations.enabled }}
# Flyway migration Job for the control-plane metadata database. Runs as a Helm
# post-install/post-upgrade hook so the CloudNativePG database exists first.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "palimpsest-paas.fullname" . }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "palimpsest-paas.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "palimpsest-paas.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flyway
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          # The image bundles the SQL under paas/control-plane/migrations and
          # the Flyway CLI. It reads the JDBC URL + credentials from the
          # CloudNativePG-generated owner Secret.
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "palimpsest-paas.fullname" . }}-control-db-app
                  key: jdbc-uri
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "palimpsest-paas.fullname" . }}-control-db-app
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "palimpsest-paas.fullname" . }}-control-db-app
                  key: password
          args: ["migrate"]
{{- end }}
