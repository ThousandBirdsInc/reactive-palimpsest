services:
  control-plane-postgres:
    image: postgres:18
    container_name: ${PALIMPSEST_PAAS_CONTROL_PLANE_POSTGRES_CONTAINER:-palimpsest-control-plane-postgres}
    environment:
      POSTGRES_DB: palimpsest_control
      POSTGRES_USER: palimpsest_control
      POSTGRES_PASSWORD: palimpsest_control
    ports:
      - "${PALIMPSEST_PAAS_CONTROL_PLANE_POSTGRES_PORT:-54330}:5432"
    volumes:
      - control-plane-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U palimpsest_control -d palimpsest_control",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:11
    depends_on:
      control-plane-postgres:
        condition: service_healthy
    environment:
      JAVA_ARGS: "-Xms16m -Xmx128m"
    working_dir: /flyway
    volumes:
      - ./flyway.conf:/flyway/conf/flyway.conf:ro
      - ./migrations:/flyway/migrations:ro
    command:
      [
        "-configFiles=/flyway/conf/flyway.conf",
        "-url=jdbc:postgresql://control-plane-postgres:5432/palimpsest_control",
        "-user=palimpsest_control",
        "-password=palimpsest_control",
        "migrate",
      ]

volumes:
  control-plane-postgres-data:
    name: ${PALIMPSEST_PAAS_CONTROL_PLANE_POSTGRES_VOLUME:-palimpsest-control-plane-postgres-data}
