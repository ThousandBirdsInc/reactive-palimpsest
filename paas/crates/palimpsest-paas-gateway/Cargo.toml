[package]
name = "palimpsest-paas-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hosted gateway primitives for Palimpsest PaaS."
keywords.workspace = true
categories.workspace = true
default-run = "palimpsest-paas-gateway"

[dependencies]
axum = { workspace = true, features = ["json"] }
bytes.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
palimpsest-paas-core = { path = "../palimpsest-paas-core" }
rustls = "0.23"
rustls-pemfile = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "net"] }
tokio-rustls = "0.26"
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "palimpsest-paas-db-proxy"
path = "src/bin/db_proxy.rs"

[lints]
workspace = true
