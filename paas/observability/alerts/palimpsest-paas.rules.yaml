groups:
  - name: palimpsest-paas.control-plane
    rules:
      - alert: PalimpsestPaaSNodeAgentCommandFailures
        expr: increase(palimpsest_paas_agent_commands_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: control-plane
        annotations:
          summary: Node-agent commands are failing
          description: One or more node-agent commands failed in the last 15 minutes.

      - alert: PalimpsestPaaSQuotaNearLimit
        expr: palimpsest_paas_quota_usage_ratio > 0.9
        for: 10m
        labels:
          severity: warning
          service: control-plane
        annotations:
          summary: Environment quota is near its limit
          description: A metered quota has been above 90% of its configured limit for 10 minutes.

      - alert: PalimpsestPaaSBillingExportFailures
        expr: increase(palimpsest_paas_billing_exports_failed_total[30m]) > 0
        for: 5m
        labels:
          severity: warning
          service: control-plane
        annotations:
          summary: Billing export failed
          description: A billing export batch failed in the last 30 minutes.

  - name: palimpsest-paas.managed-postgres
    rules:
      - alert: PalimpsestManagedPostgresBackupStale
        expr: time() - palimpsest_managed_postgres_last_successful_backup_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
          service: managed-postgres
        annotations:
          summary: Managed Postgres backup is stale
          description: A managed Postgres cluster has not completed a backup in more than 26 hours.

      - alert: PalimpsestManagedPostgresWalArchiveFailures
        expr: increase(palimpsest_managed_postgres_wal_archives_failed_total[30m]) > 0
        for: 10m
        labels:
          severity: warning
          service: managed-postgres
        annotations:
          summary: Managed Postgres WAL archive failed
          description: At least one managed Postgres WAL archive command failed in the last 30 minutes.

      - alert: PalimpsestManagedPostgresPitrCheckStale
        expr: time() - palimpsest_managed_postgres_last_successful_pitr_check_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
          service: managed-postgres
        annotations:
          summary: Managed Postgres PITR continuity check is stale
          description: A managed Postgres cluster has not completed a PITR continuity check in more than 26 hours.

      - alert: PalimpsestManagedPostgresRestoreDrillStale
        expr: time() - palimpsest_managed_postgres_last_successful_restore_drill_timestamp_seconds > 2592000
        for: 1h
        labels:
          severity: warning
          service: managed-postgres
        annotations:
          summary: Managed Postgres restore drill is stale
          description: A managed Postgres cluster has not completed a restore drill in more than 30 days.

      - alert: PalimpsestManagedPostgresStandbyCheckStale
        expr: time() - palimpsest_managed_postgres_last_successful_standby_check_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: warning
          service: managed-postgres
        annotations:
          summary: Managed Postgres standby lag check is stale
          description: A managed Postgres cluster has not completed a standby lag check in more than 26 hours.

      - alert: PalimpsestManagedPostgresStoragePressure
        expr: palimpsest_managed_postgres_storage_used_ratio > 0.85
        for: 15m
        labels:
          severity: warning
          service: managed-postgres
        annotations:
          summary: Managed Postgres storage pressure is high
          description: A managed Postgres cluster is using more than 85% of its allocated storage.

  - name: palimpsest-paas.gateway
    rules:
      - alert: PalimpsestGatewayHighErrorRate
        expr: |
          sum(rate(palimpsest_gateway_rejected_requests_total[5m]))
            / clamp_min(sum(rate(palimpsest_gateway_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: Gateway rejection rate is high
          description: More than 5% of gateway requests have been rejected for 10 minutes.

      - alert: PalimpsestGatewayRateLimited
        expr: increase(palimpsest_gateway_rate_limited_requests_total[10m]) > 0
        for: 5m
        labels:
          severity: info
          service: gateway
        annotations:
          summary: Gateway rate limiting is active
          description: At least one environment has hit a gateway request or connection limit.
