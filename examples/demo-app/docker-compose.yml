# Palimpsest demo: write API + gRPC-Web in a single Rust binary,
# behind an nginx-served React+WASM frontend.
#
# Bring up:
#   docker compose up --build
# Tear down:
#   docker compose down

services:
  server:
    build:
      context: ../..              # workspace root — needed for path deps
      dockerfile: examples/demo-app/server/Dockerfile
    image: palimpsest-demo-server:dev
    container_name: palimpsest-demo-server
    ports:
      - "3000:3000"                # write API
      - "50051:50051"              # palimpsest gRPC-Web
    environment:
      RUST_LOG: "info,palimpsest_demo_server=debug,palimpsest_server=info"
    healthcheck:
      test: ["CMD", "/usr/local/bin/palimpsest-demo-server", "--healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 5

  web:
    build:
      context: ../..              # workspace root — needed for the wasm-pack build
      dockerfile: examples/demo-app/web/Dockerfile
    image: palimpsest-demo-web:dev
    container_name: palimpsest-demo-web
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_started
