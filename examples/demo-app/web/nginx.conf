server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html; the JS chunks are content-hashed.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Reverse-proxy the write API. Lets the browser talk to the server
    # same-origin, so we never need CORS preflights.
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket bridge for the Subscribe RPC. gRPC-Web in browsers
    # can't drive bidi streams (no fetch upload streams in Firefox/
    # Safari), so the demo server exposes a WS endpoint that carries
    # the same ClientMessage/ServerMessage protos as binary frames and
    # proxies them to its in-process gRPC SyncEngine.
    location /ws/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade dance.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Long-lived connection — never time out the read side.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
