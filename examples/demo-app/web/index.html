<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palimpsest demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; max-width: 820px;
             margin: 32px auto; padding: 0 16px; color: #1a1a1a; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      h2 { margin: 0; font-size: 15px; font-weight: 600; color: #1a1a1a; }
      p.tagline { color: #666; margin: 0 0 16px; }

      section.panel {
        border: 1px solid #e5e5e5; border-radius: 8px;
        padding: 16px; margin: 16px 0; background: white;
      }
      .panel-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 10px;
      }
      .filters { display: flex; gap: 6px; }
      .chip {
        font: inherit; font-size: 12px; padding: 3px 10px;
        border: 1px solid #ccc; border-radius: 999px;
        background: white; color: #444; cursor: pointer;
      }
      .chip:hover { background: #f5f5f5; }
      .chip-active {
        background: #1a73e8; border-color: #1a73e8; color: white;
      }

      pre.sql {
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        background: #f7f9fc; border: 1px solid #e1e7ef;
        border-left: 3px solid #1a73e8;
        border-radius: 4px;
        padding: 10px 12px; margin: 0 0 14px;
        white-space: pre-wrap; color: #1a1a1a;
        transition: border-left-color 180ms ease;
      }
      pre.sql[data-active-filter="published"] { border-left-color: #137333; }
      pre.sql[data-active-filter="draft"]     { border-left-color: #b06000; }

      .bar-row {
        display: grid;
        grid-template-columns: 80px 1fr 32px;
        align-items: center; gap: 10px;
        padding: 4px 0;
      }
      .bar-label { font-size: 12px; color: #444; text-transform: uppercase;
                   letter-spacing: 0.04em; }
      .bar-track {
        background: #f0f0f0; border-radius: 3px; height: 18px; overflow: hidden;
      }
      .bar-fill {
        height: 100%; border-radius: 3px;
        transition: width 250ms ease;
      }
      .bar-published { background: #137333; }
      .bar-draft     { background: #b06000; }
      .bar-events    { background: #1a73e8; }
      .bar-value {
        font-variant-numeric: tabular-nums; text-align: right;
        font-size: 13px; color: #333;
      }

      .bubble-chart { display: block; width: 100%; height: auto;
                      margin-top: 4px; }
      .bubble-grid { stroke: #eef1f5; stroke-width: 1; }
      .bubble-axis { stroke: #c8ced8; stroke-width: 1; }
      .bubble-tick { font-size: 11px; fill: #6b7280;
                     font-variant-numeric: tabular-nums; }
      .bubble-axis-label { font-size: 12px; fill: #1f2937; font-weight: 500; }
      .bubble circle {
        stroke-width: 1.5;
        transition: cx 480ms cubic-bezier(.4,0,.2,1),
                    cy 480ms cubic-bezier(.4,0,.2,1),
                    r  480ms cubic-bezier(.4,0,.2,1),
                    fill 480ms ease;
      }
      .bubble-label {
        font: 600 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        fill: #11181c; pointer-events: none;
        transition: x 480ms cubic-bezier(.4,0,.2,1),
                    y 480ms cubic-bezier(.4,0,.2,1);
      }
      .auto-toggle {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 12px; color: #555; padding: 3px 8px;
        border: 1px solid #e1e7ef; border-radius: 999px;
        background: #f7f9fc;
      }
      .auto-toggle input { margin: 0; }

      .chip:disabled { opacity: 0.45; cursor: not-allowed; }
      .rule-text { margin: 4px 0; font-size: 13px; color: #444; }
      .status { font-size: 12px; padding: 2px 8px; border-radius: 4px;
                background: #eee; color: #444; }
      .status.open { background: #e6f4ea; color: #137333; }
      .status.error { background: #fce8e6; color: #c5221f; }
      form.create { display: flex; gap: 8px; margin: 16px 0; }
      form.create input[type=text] { flex: 1; padding: 6px 8px;
        border: 1px solid #ccc; border-radius: 4px; font: inherit; }
      form.create button { padding: 6px 14px; border: 1px solid #1a73e8;
        background: #1a73e8; color: white; border-radius: 4px;
        cursor: pointer; font: inherit; }
      form.create button:disabled { background: #c7c7c7; border-color: #c7c7c7;
        color: #6f6f6f; cursor: not-allowed; }
      ul.posts { list-style: none; padding: 0; margin: 0; }
      ul.posts li { display: flex; align-items: center; gap: 12px;
        border: 1px solid #eee; padding: 10px 12px; margin-bottom: 8px;
        border-radius: 6px; }
      .post-title { flex: 1; }
      .post-id { color: #999; font-variant-numeric: tabular-nums;
        font-size: 12px; }
      .badge { font-size: 11px; padding: 1px 6px; border-radius: 3px;
        text-transform: uppercase; letter-spacing: 0.05em; }
      .badge.published { background: #e6f4ea; color: #137333; }
      .badge.draft { background: #fef7e0; color: #b06000; }
      button.row-action { font: inherit; border: 1px solid #ddd;
        background: white; padding: 4px 10px; border-radius: 4px;
        cursor: pointer; }
      button.row-action:hover { background: #f5f5f5; }
      .empty { color: #777; font-style: italic; padding: 16px; }
      .error-banner { background: #fce8e6; color: #c5221f; padding: 8px 12px;
        border-radius: 4px; margin: 8px 0; font-size: 13px; }
      footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #eee;
        color: #999; font-size: 12px; }
      code { background: #f5f5f5; padding: 1px 4px; border-radius: 3px;
        font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
