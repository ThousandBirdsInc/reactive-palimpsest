<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palimpsest Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        /* Ink + chrome tokens (light surface) */
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --ink-muted: #898781;
        --grid: #e1e0d9;
        --baseline: #c3c2b7;
        --accent: #2a78d6;
        --surface: #ffffff;
        --plane: #f9f9f7;
        --hairline: #e5e5e5;
      }
      body { font: 14px/1.4 system-ui, sans-serif; max-width: 1160px;
             margin: 24px auto 48px; padding: 0 20px; color: var(--ink);
             background: var(--surface); }
      h1 { margin: 12px 0 4px; font-size: 22px; }
      h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
      p.tagline { color: #666; margin: 0 0 16px; max-width: 72ch; }

      /* ---- top bar ---- */
      nav.top-nav { display: flex; align-items: center; gap: 4px;
        border-bottom: 1px solid var(--hairline); }
      nav.top-nav a { padding: 8px 14px; font-size: 13px; color: #555;
        text-decoration: none; border: 1px solid transparent;
        border-bottom: none; border-radius: 6px 6px 0 0; }
      nav.top-nav a:hover { background: #f5f5f5; }
      nav.top-nav a.top-nav-active { color: var(--accent); font-weight: 600;
        background: var(--surface); border-color: var(--hairline);
        margin-bottom: -1px; padding-bottom: 9px; }
      .top-nav-spacer { flex: 1; }
      .sim-control { display: flex; align-items: center; gap: 10px;
        padding: 4px 0; }
      .persona-bar { display: flex; align-items: center; gap: 12px;
        flex-wrap: wrap; padding: 10px 0 0; }
      .conn-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px;
        text-transform: uppercase; letter-spacing: 0.05em; }
      .conn-ok { background: #e6f4ea; color: #137333; }
      .conn-warn { background: #fef7e0; color: #b06000; }
      .conn-err { background: #fce8e6; color: #c5221f;
        text-transform: none; letter-spacing: 0; }

      /* ---- panels & chips ---- */
      section.panel {
        border: 1px solid var(--hairline); border-radius: 8px;
        padding: 16px; margin: 16px 0; background: var(--surface);
      }
      .panel-head {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 12px; margin-bottom: 10px;
      }
      .panel-subtitle { font-size: 12px; color: var(--ink-muted); }
      .filters { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        font: inherit; font-size: 12px; padding: 3px 10px;
        border: 1px solid #ccc; border-radius: 999px;
        background: var(--surface); color: #444; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .chip:hover { background: #f5f5f5; }
      .chip:disabled { color: #aaa; cursor: not-allowed; }
      .chip-active {
        background: var(--accent); border-color: var(--accent); color: white;
      }
      /* .chip:hover is more specific than .chip-active; keep the
         active chip filled (slightly deeper) under the cursor. */
      .chip-active:hover { background: #1c5cab; border-color: #1c5cab; }

      pre.sql {
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        background: #f7f9fc; border: 1px solid #e1e7ef;
        border-left: 3px solid var(--accent);
        border-radius: 4px;
        padding: 10px 12px; margin: 0 0 10px;
        white-space: pre-wrap; color: var(--ink);
      }
      details.board-sql { margin: 10px 0 0; }
      details.board-sql summary { font-size: 12px; color: var(--ink-muted);
        cursor: pointer; margin-bottom: 6px; }

      .rule-text { font-size: 12.5px; color: #555; margin: 6px 0; }
      .rule-text code { white-space: nowrap; }

      /* ---- composer & generic forms ---- */
      .composer, form.create { display: flex; gap: 8px; margin: 14px 0;
        flex-wrap: wrap; }
      .composer input[type="text"], form.create input[type="text"] {
        flex: 1; min-width: 220px; font: inherit; padding: 7px 10px;
        border: 1px solid #ccc; border-radius: 6px; }
      .composer select { font: inherit; font-size: 13px; padding: 6px 8px;
        border: 1px solid #ccc; border-radius: 6px; background: white; }
      .composer button, form.create button { font: inherit; padding: 7px 14px;
        border: none; border-radius: 6px; background: var(--accent);
        color: white; cursor: pointer; }
      .composer button:disabled, form.create button:disabled {
        background: #b3cdf0; cursor: not-allowed; }

      .board-filters { display: flex; align-items: center; gap: 16px;
        flex-wrap: wrap; margin: 4px 0 12px; }

      /* ---- board ---- */
      .board { display: grid; grid-template-columns: repeat(5, 1fr);
        gap: 10px; align-items: start; }
      @media (max-width: 980px) { .board { grid-template-columns: repeat(2, 1fr); } }
      .board-col { background: var(--plane); border: 1px solid var(--hairline);
        border-radius: 8px; padding: 8px; min-height: 120px; }
      .board-col-head { display: flex; align-items: center; gap: 7px;
        padding: 2px 4px 8px; }
      .board-col-head h2 { font-size: 13px; }
      .board-col-count { margin-left: auto; font-size: 11px;
        color: var(--ink-muted); font-variant-numeric: tabular-nums; }
      .board-col-cards { display: flex; flex-direction: column; gap: 8px; }
      .board-more, .board-empty { font-size: 12px; color: var(--ink-muted);
        text-align: center; padding: 6px; }

      .status-dot { width: 9px; height: 9px; border-radius: 50%;
        background: var(--ink-muted); }
      .status-dot[data-status="backlog"] { background: #86b6ef; }
      .status-dot[data-status="todo"] { background: #5598e7; }
      .status-dot[data-status="in_progress"] { background: #2a78d6; }
      .status-dot[data-status="in_review"] { background: #1c5cab; }
      .status-dot[data-status="done"] { background: #104281; }

      .issue-card { background: var(--surface); border: 1px solid var(--hairline);
        border-radius: 7px; padding: 8px 10px; font-size: 12.5px;
        display: flex; flex-direction: column; gap: 6px; }
      .issue-card-top { display: flex; align-items: center; gap: 6px; }
      .issue-key { color: var(--ink-muted); font-size: 11px;
        font-variant-numeric: tabular-nums; }
      .issue-estimate { margin-left: auto; font-size: 10.5px;
        color: var(--ink-2); border: 1px solid var(--grid);
        border-radius: 4px; padding: 0 5px;
        font-variant-numeric: tabular-nums; }
      .issue-title { line-height: 1.35; }
      .issue-card-bottom { display: flex; align-items: center; gap: 8px; }
      .issue-project { display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; color: var(--ink-2); }
      .project-dot { width: 8px; height: 8px; border-radius: 50%;
        display: inline-block; }
      .avatar { margin-left: auto; width: 20px; height: 20px;
        border-radius: 50%; background: #e8f0fe; color: #1a56b8;
        font-size: 11px; font-weight: 600; display: inline-flex;
        align-items: center; justify-content: center; }
      .avatar-empty { background: transparent;
        border: 1px dashed var(--baseline); }
      .prio { width: 14px; height: 14px; flex: none; }

      .issue-actions { display: none; gap: 5px; align-items: center;
        border-top: 1px dashed var(--grid); padding-top: 6px; }
      .issue-card:hover .issue-actions,
      .issue-card:focus-within .issue-actions { display: flex; }
      .icon-btn { font: inherit; font-size: 10px; line-height: 1;
        padding: 4px 7px; border: 1px solid #ddd; background: white;
        border-radius: 4px; cursor: pointer; color: var(--ink-2); }
      .icon-btn:hover { background: #f5f5f5; }
      .icon-btn:disabled { color: #ccc; cursor: default; }
      .icon-btn-danger { margin-left: auto; }
      .icon-btn-danger:hover { background: #fce8e6; color: #c5221f;
        border-color: #f3b6b3; }
      .mini-select { font: inherit; font-size: 11px; padding: 2px 4px;
        border: 1px solid #ddd; border-radius: 4px; background: white;
        color: var(--ink-2); max-width: 92px; }

      /* ---- analytics ---- */
      .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr);
        gap: 10px; margin: 16px 0; }
      @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
      .stat-tile { border: 1px solid var(--hairline); border-radius: 8px;
        padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
        background: var(--surface); }
      .stat-label { font-size: 12px; color: var(--ink-2); }
      .stat-value { font-size: 26px; font-weight: 600; }
      .stat-alert { color: #d03b3b; }
      .stat-suffix { font-size: 13px; font-weight: 400;
        color: var(--ink-muted); margin-left: 2px; }
      .stat-delta { font-size: 12px; }

      svg.chart { width: 100%; height: auto; display: block; }
      .chart-wrap { position: relative; }
      .chart-tooltip { position: absolute; top: 6px; right: 8px;
        background: var(--surface); border: 1px solid var(--hairline);
        border-radius: 6px; padding: 4px 10px; font-size: 12px;
        color: var(--ink-2); box-shadow: 0 1px 4px rgba(11,11,11,0.08);
        pointer-events: none; }
      .chart-legend { display: flex; gap: 14px; flex-wrap: wrap;
        font-size: 12px; color: var(--ink-2); margin: 0 0 8px; }
      .chart-legend-item { display: inline-flex; align-items: center;
        gap: 6px; }
      .chart-legend-swatch { width: 10px; height: 10px; border-radius: 3px;
        display: inline-block; }

      /* ---- simulator + toggles ---- */
      .auto-toggle { display: inline-flex; align-items: center; gap: 6px;
        font-size: 12.5px; color: #444; cursor: pointer; }
      .pace-slider { width: 120px; accent-color: var(--accent); }
      .pace-value { font-size: 12px; color: var(--ink-2);
        font-variant-numeric: tabular-nums; }

      /* ---- generic list rows (local-first queue) ---- */
      ul.posts { list-style: none; padding: 0; margin: 0; }
      ul.posts li { display: flex; align-items: center; gap: 12px;
        border: 1px solid #eee; padding: 8px 12px; margin-bottom: 8px;
        border-radius: 6px; }
      .post-title { flex: 1; }
      .post-id { color: #999; font-variant-numeric: tabular-nums;
        font-size: 12px; }
      .badge { font-size: 11px; padding: 1px 6px; border-radius: 3px;
        letter-spacing: 0.02em; white-space: nowrap; }
      .badge.lf-stage { background: #e8f0fe; color: #1a56b8; }
      .badge.lf-stage[data-status="in_review"] { background: #e2eafc; color: #16468a; }
      .badge.lf-stage[data-status="todo"] { background: #eef4fd; color: #2a6ac2; }
      button.row-action { font: inherit; font-size: 12px;
        border: 1px solid #ddd; background: white; padding: 4px 10px;
        border-radius: 4px; cursor: pointer; white-space: nowrap; }
      button.row-action:hover { background: #f5f5f5; }
      button.row-action:disabled { color: #bbb; cursor: default; }
      .empty { color: #777; font-style: italic; padding: 12px; }
      .error-banner { background: #fce8e6; color: #c5221f; padding: 8px 12px;
        border-radius: 4px; margin: 8px 0; font-size: 13px; }
      footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #eee;
        color: #999; font-size: 12px; }
      code { background: #f5f5f5; padding: 1px 4px; border-radius: 3px;
        font-size: 12px; }

      /* ---- permissions playground ---- */
      .dsl-presets { margin: 8px 0 10px; }
      .dsl-editor { width: 100%; box-sizing: border-box; min-height: 170px;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        border: 1px solid #e1e7ef; border-radius: 6px; padding: 10px 12px;
        resize: vertical; background: #fbfcfe; color: var(--ink); }
      .dsl-editor:disabled { color: #999; }
      .dsl-flash { font-size: 12.5px; color: #137333; background: #e6f4ea;
        border-radius: 4px; padding: 6px 10px; margin: 8px 0; }
      .dsl-rules { margin-top: 12px; display: flex; flex-direction: column;
        gap: 6px; }
      .dsl-rules-title { font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.06em; color: #888; }
      .dsl-rule { display: flex; align-items: baseline; gap: 10px;
        font-size: 12.5px; flex-wrap: wrap; }
      .dsl-rule-name { font-weight: 600; }
      .dsl-rule-table { color: #666; }
      .dsl-rule-mode { font-size: 10.5px; text-transform: uppercase;
        letter-spacing: 0.05em; color: #999; border: 1px solid var(--grid);
        border-radius: 999px; padding: 0 6px; }
      .dsl-rule-pred { flex: 1 1 100%; }

      /* ---- local-first page ---- */
      .lf-status-row { display: flex; flex-wrap: wrap; gap: 8px;
        margin: 10px 0 0; }
      .lf-chip { display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; padding: 3px 10px; border-radius: 999px;
        border: 1px solid #ddd; background: #fafafa; color: #333;
        font-variant-numeric: tabular-nums; }
      .lf-chip-label { text-transform: uppercase; letter-spacing: 0.05em;
        font-size: 10px; color: #888; }
      .lf-chip-ok { border-color: #b7dfc4; background: #e6f4ea;
        color: #137333; }
      .lf-chip-ok .lf-chip-label { color: #137333aa; }
      .lf-chip-warn { border-color: #f2dda2; background: #fef7e0;
        color: #b06000; }
      .lf-chip-warn .lf-chip-label { color: #b06000aa; }
      .lf-chip-err { border-color: #f3b6b3; background: #fce8e6;
        color: #c5221f; }
      .lf-chip-err .lf-chip-label { color: #c5221faa; }

      .lf-compare { display: grid; grid-template-columns: 1fr 1fr;
        gap: 14px; }
      @media (max-width: 800px) { .lf-compare { grid-template-columns: 1fr; } }
      .lf-col-title { margin: 0 0 8px; font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.05em; color: #666; }
      .lf-col-hint { font-weight: 400; text-transform: none;
        letter-spacing: 0; color: #999; }

      table.lf-table { width: 100%; border-collapse: collapse;
        font-size: 12.5px; font-variant-numeric: tabular-nums; }
      table.lf-table th { text-align: left; font-weight: 600; color: #666;
        border-bottom: 1px solid #e1e7ef; padding: 4px 8px; }
      table.lf-table td { border-bottom: 1px solid #f0f0f0;
        padding: 4px 8px; }

      ul.lf-events { list-style: none; padding: 0; margin: 0;
        font-size: 12.5px; }
      ul.lf-events li { display: flex; align-items: baseline; gap: 10px;
        padding: 4px 2px; border-bottom: 1px dashed #f0f0f0; }
      .lf-event-time { color: #999; font-variant-numeric: tabular-nums;
        font-size: 11px; }
      .lf-event-kind { font-size: 10.5px; padding: 1px 7px;
        border-radius: 999px; text-transform: uppercase;
        letter-spacing: 0.04em; background: #eef1f5; color: #556; }
      .lf-event-applied { background: #e8f0fe; color: #1a56b8; }
      .lf-event-mutationSettled { background: #e6f4ea; color: #137333; }
      .lf-event-mutationConflicted { background: #fef7e0; color: #b06000; }
      .lf-event-mutationFailed { background: #fce8e6; color: #c5221f; }
      .lf-event-mirrorError { background: #fce8e6; color: #c5221f; }
      .lf-event-detail { color: #444; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
