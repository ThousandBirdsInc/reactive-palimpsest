name: Auto release

# Bumping `version` in the workspace `Cargo.toml` is the release
# action: when a push to main carries a version that has no `v<version>`
# tag yet, this workflow tags the merge commit and runs the release
# pipeline for it (binaries, GitHub Release, container image).
#
# Why the release is *called* rather than triggered by the tag: tags
# pushed with the workflow's own GITHUB_TOKEN deliberately do not
# start other workflows, so `release.yml` is invoked here as a
# reusable workflow, in the same run.
#
# A merge that does not change the version does nothing. Re-merging
# the same version does nothing either (the tag already exists); to
# republish a tag after a failed attempt, run `Release` from the
# Actions tab with that tag.

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: read

jobs:
  tag:
    name: Tag new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      created: ${{ steps.check.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ -z "${version}" ]]; then
            echo "::error::could not read workspace.package.version from Cargo.toml"
            exit 1
          fi
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "palimpsest ${tag}"
          git push origin "refs/tags/${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Tagged ${GITHUB_SHA} as ${tag}."

  release:
    name: Release ${{ needs.tag.outputs.tag }}
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
