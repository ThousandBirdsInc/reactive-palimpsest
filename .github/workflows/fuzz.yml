name: fuzz

# Four fuzz targets, 30 minutes each, every night. Crash artifacts
# are uploaded and a tracking issue is auto-filed with the seed so the
# team has a stable repro point. PRs do not run fuzz — only nightly,
# to keep the merge gate fast.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Specific fuzz target to run (or "all")'
        required: false
        default: 'all'
      duration_seconds:
        description: 'Per-target wall budget'
        required: false
        default: '1800'

# Least privilege: the default GITHUB_TOKEN gets read-only access.
# Jobs that need more (publishing, filing issues) widen it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `File tracking issue on crash` calls the issues API; the default
    # token is read-only, which turned every crash into a second,
    # confusing "Resource not accessible by integration" failure.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - pgoutput_decoder
          - sql_parser
          - wire_decoder
          - named_query_registrar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly (cargo-fuzz requires nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install protoc
        uses: ./.github/actions/setup-protoc

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache fuzz target
        uses: actions/cache@v4
        with:
          path: fuzz/target
          key: ubuntu-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-fuzz-${{ matrix.target }}-

      - name: Run target
        id: run
        continue-on-error: true
        run: |
          DURATION='${{ inputs.duration_seconds || 1800 }}'
          cargo fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            -- -max_total_time=$DURATION \
               -timeout=20 \
               -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/**
          if-no-files-found: ignore

      - name: File tracking issue on crash
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          TARGET: ${{ matrix.target }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const target = process.env.TARGET;
            const dir = `fuzz/artifacts/${target}`;
            let seed = '(no artifact found)';
            try {
              // libFuzzer names artifacts by failure class: a panic
              // is `crash-*`, but a hang is `timeout-*`, a memory blowup
              // `oom-*`, and a slow input `slow-unit-*`. All of them are
              // findings (a 20 s parse is a denial-of-service vector),
              // so pick up every class.
              const prefixes = ['crash-', 'timeout-', 'oom-', 'leak-', 'slow-unit-'];
              const files = fs.readdirSync(dir).filter(f => prefixes.some(p => f.startsWith(p)));
              files.sort();
              if (files.length > 0) {
                const buf = fs.readFileSync(path.join(dir, files[0]));
                seed = `\`${files[0]}\` (${buf.length} bytes)\n\n` +
                       '```\n' +
                       buf.toString('hex').match(/.{1,64}/g).join('\n') +
                       '\n```';
              }
            } catch (e) {
              core.warning(`could not read crash dir: ${e.message}`);
            }
            const title = `[fuzz] ${target} crashed in ${context.sha.slice(0,7)}`;
            const body =
              `Nightly fuzz run failed on \`${target}\`.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Seed:\n\n${seed}\n\n` +
              `Reproduce locally:\n\n` +
              '```bash\n' +
              `cargo +nightly fuzz run ${target} fuzz/artifacts/${target}/<seed-file>\n` +
              '```\n';
            // One tracking issue per (target, commit): a failure that
            // reproduces every night appends to the open issue instead
            // of filing a duplicate.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fuzz',
              per_page: 100,
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Reproduced again.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['fuzz', 'P1'],
                body,
              });
            }
