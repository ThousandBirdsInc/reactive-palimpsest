name: fuzz

# Three fuzz targets, 30 minutes each, every night. Crash artifacts
# are uploaded and a tracking issue is auto-filed with the seed so the
# team has a stable repro point. PRs do not run fuzz — only nightly,
# to keep the merge gate fast.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Specific fuzz target to run (or "all")'
        required: false
        default: 'all'
      duration_seconds:
        description: 'Per-target wall budget'
        required: false
        default: '1800'

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - pgoutput_decoder
          - sql_parser
          - wire_decoder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly (cargo-fuzz requires nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install protoc
        uses: ./.github/actions/setup-protoc

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache fuzz target
        uses: actions/cache@v4
        with:
          path: fuzz/target
          key: ubuntu-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-fuzz-${{ matrix.target }}-

      - name: Run target
        id: run
        continue-on-error: true
        run: |
          DURATION='${{ inputs.duration_seconds || 1800 }}'
          cargo fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            -- -max_total_time=$DURATION \
               -timeout=20 \
               -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/**
          if-no-files-found: ignore

      - name: File tracking issue on crash
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          TARGET: ${{ matrix.target }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const target = process.env.TARGET;
            const dir = `fuzz/artifacts/${target}`;
            let seed = '(no artifact found)';
            try {
              const files = fs.readdirSync(dir).filter(f => f.startsWith('crash-'));
              files.sort();
              if (files.length > 0) {
                const buf = fs.readFileSync(path.join(dir, files[0]));
                seed = `\`${files[0]}\` (${buf.length} bytes)\n\n` +
                       '```\n' +
                       buf.toString('hex').match(/.{1,64}/g).join('\n') +
                       '\n```';
              }
            } catch (e) {
              core.warning(`could not read crash dir: ${e.message}`);
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[fuzz] ${target} crashed in ${context.sha.slice(0,7)}`,
              labels: ['fuzz', 'P1'],
              body:
                `Nightly fuzz run failed on \`${target}\`.\n\n` +
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                `Seed:\n\n${seed}\n\n` +
                `Reproduce locally:\n\n` +
                '```bash\n' +
                `cargo +nightly fuzz run ${target} fuzz/artifacts/${target}/<seed-file>\n` +
                '```\n',
            });
