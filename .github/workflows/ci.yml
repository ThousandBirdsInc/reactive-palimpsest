name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Install protoc
        uses: ./.github/actions/setup-protoc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-cargo-

      - name: Cache target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-target-

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

      - name: Reference executor line budget
        run: cargo run -p xtask -- check-reference-budget

      - name: Install cargo-insta
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo install cargo-insta --locked

      - name: Snapshot tests
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo insta test --unreferenced reject -p palimpsest-sql

      - name: Clippy
        # Strict `-D warnings` only on stable. Nightly clippy's unstable
        # lints churn (and some currently mis-fire on non-trait-impl async
        # fns), which would break CI on toolchain rolls unrelated to our
        # code. Nightly still builds + tests above.
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-stable-cargo-deny-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-stable-cargo-deny-

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependencies
        run: cargo deny check
