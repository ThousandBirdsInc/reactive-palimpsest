<svg viewBox="0 0 1200 340" width="1200" height="340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="0.55" stop-color="#0e0a12"/>
      <stop offset="1" stop-color="#170a14"/>
    </linearGradient>

    <radialGradient id="vignette" cx="600" cy="150" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- warm pink -> orange wordmark, inspired by the reference palette -->
    <linearGradient id="ink" x1="320" y1="120" x2="900" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8ad0"/>
      <stop offset="0.34" stop-color="#ff66c1"/>
      <stop offset="0.68" stop-color="#ff5e3a"/>
      <stop offset="1" stop-color="#ff4100"/>
    </linearGradient>

    <linearGradient id="teal" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ffaf"/>
      <stop offset="1" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- moving scribe / reveal sweep -->
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff4e6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff4e6" stop-opacity="0"/>
    </linearGradient>

    <!-- shimmer band across the wordmark -->
    <linearGradient id="shimmerGrad" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- one "page" of erased writing: word-shaped strokes -->
    <g id="page" fill="currentColor">
      <g transform="translate(0,12)"><rect width="70" height="9" rx="4"/><rect x="82" width="120" height="9" rx="4"/><rect x="214" width="54" height="9" rx="4"/><rect x="280" width="150" height="9" rx="4"/><rect x="442" width="90" height="9" rx="4"/></g>
      <g transform="translate(0,44)"><rect width="110" height="9" rx="4"/><rect x="124" width="60" height="9" rx="4"/><rect x="196" width="140" height="9" rx="4"/><rect x="348" width="80" height="9" rx="4"/><rect x="440" width="92" height="9" rx="4"/></g>
      <g transform="translate(0,76)"><rect width="80" height="9" rx="4"/><rect x="92" width="170" height="9" rx="4"/><rect x="274" width="70" height="9" rx="4"/><rect x="356" width="120" height="9" rx="4"/></g>
      <g transform="translate(0,108)"><rect width="140" height="9" rx="4"/><rect x="152" width="70" height="9" rx="4"/><rect x="234" width="110" height="9" rx="4"/><rect x="356" width="60" height="9" rx="4"/><rect x="428" width="104" height="9" rx="4"/></g>
      <g transform="translate(0,140)"><rect width="60" height="9" rx="4"/><rect x="72" width="120" height="9" rx="4"/><rect x="204" width="90" height="9" rx="4"/><rect x="306" width="160" height="9" rx="4"/></g>
      <g transform="translate(0,172)"><rect width="120" height="9" rx="4"/><rect x="132" width="80" height="9" rx="4"/><rect x="224" width="140" height="9" rx="4"/><rect x="376" width="70" height="9" rx="4"/></g>
      <g transform="translate(0,204)"><rect width="100" height="9" rx="4"/><rect x="112" width="150" height="9" rx="4"/><rect x="274" width="60" height="9" rx="4"/><rect x="346" width="110" height="9" rx="4"/></g>
    </g>

    <clipPath id="titleClip">
      <text x="600" y="184" text-anchor="middle" font-family="'Iowan Old Style', Palatino, Georgia, 'Times New Roman', serif" font-size="92" font-weight="600" letter-spacing="6">PALIMPSEST</text>
    </clipPath>

    <style>
      @keyframes drift  { from { transform: translateY(0); }      to { transform: translateY(-7px); } }
      @keyframes driftB { from { transform: translateY(0); }      to { transform: translateY(6px); } }
      @keyframes ghostA { 0%,100% { opacity: .05; } 50% { opacity: .15; } }
      @keyframes ghostB { 0%,100% { opacity: .12; } 50% { opacity: .035; } }
      @keyframes sweep  { 0% { transform: translateX(-360px) skewX(-14deg); } 100% { transform: translateX(1340px) skewX(-14deg); } }
      @keyframes write  { 0% { transform: scaleX(0); opacity: 0; } 12% { opacity: 1; } 52% { transform: scaleX(1); opacity: 1; } 78% { transform: scaleX(1); opacity: 1; } 92% { opacity: 0; } 100% { transform: scaleX(1); opacity: 0; } }
      @keyframes shimmer{ 0% { transform: translateX(140px); } 55% { transform: translateX(940px); } 100% { transform: translateX(940px); } }
      @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pop    { 0%,100% { opacity: .14; } 8% { opacity: 1; } 38% { opacity: .45; } }

      .layerA  { color: #b8a079; animation: ghostA 9s ease-in-out infinite; }
      .layerB  { color: #5b7d86; animation: ghostB 9s ease-in-out infinite; }
      .driftA  { animation: drift 11s ease-in-out infinite alternate; }
      .driftB  { animation: driftB 13s ease-in-out infinite alternate; }
      .sweep   { animation: sweep 7.5s linear infinite; }
      .stroke  { transform-box: fill-box; transform-origin: 0% 50%; animation: write 6s ease-in-out infinite; }
      .shimmer { animation: shimmer 5.5s ease-in-out infinite; }
      .caret   { animation: blink 1.1s step-end infinite; }
      .cell    { transform-box: fill-box; transform-origin: center; }
      .c0 { animation: pop 4s ease-in-out infinite;            }
      .c1 { animation: pop 4s ease-in-out infinite .28s;       }
      .c2 { animation: pop 4s ease-in-out infinite .56s;       }
      .c3 { animation: pop 4s ease-in-out infinite .84s;       }
      .c4 { animation: pop 4s ease-in-out infinite 1.12s;      }
      .c5 { animation: pop 4s ease-in-out infinite 1.40s;      }
      .c6 { animation: pop 4s ease-in-out infinite 1.68s;      }
      .c7 { animation: pop 4s ease-in-out infinite 1.96s;      }
      .c8 { animation: pop 4s ease-in-out infinite 2.24s;      }
      .c9 { animation: pop 4s ease-in-out infinite 2.52s;      }

      @media (prefers-reduced-motion: reduce) {
        .layerA,.layerB,.driftA,.driftB,.sweep,.stroke,.shimmer,.caret,.title,.c0,.c1,.c2,.c3,.c4,.c5,.c6,.c7,.c8,.c9 { animation: none; }
        .stroke { transform: scaleX(1); opacity: 1; }
        .layerA { opacity: .1; } .layerB { opacity: .08; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- erased older writing, two inks bleeding through -->
  <g class="layerB" transform="rotate(1.4 600 170)">
    <g class="driftB">
      <use href="#page" x="120" y="44"/>
      <use href="#page" x="640" y="44"/>
    </g>
  </g>
  <g class="layerA" transform="rotate(-1 600 170)">
    <g class="driftA">
      <use href="#page" x="110" y="40"/>
      <use href="#page" x="628" y="40"/>
    </g>
  </g>

  <!-- scribe scrape passing over the vellum -->
  <rect class="sweep" x="0" y="0" width="240" height="340" fill="url(#sweepGrad)"/>

  <!-- the re-inked wordmark -->
  <g class="title">
    <text x="600" y="184" text-anchor="middle" fill="url(#ink)" font-family="'Iowan Old Style', Palatino, Georgia, 'Times New Roman', serif" font-size="92" font-weight="600" letter-spacing="6">PALIMPSEST</text>
    <g clip-path="url(#titleClip)">
      <rect class="shimmer" x="0" y="80" width="120" height="130" fill="url(#shimmerGrad)"/>
    </g>
  </g>

  <!-- scribe stroke that re-writes beneath the title -->
  <rect class="stroke" x="362" y="206" width="476" height="3" rx="1.5" fill="url(#teal)"/>

  <!-- mono subtitle + live caret -->
  <text x="600" y="252" text-anchor="middle" fill="#8b94a7" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="1.5">Postgres WAL-backed live query sync</text>
  <rect class="caret" x="861" y="237" width="11" height="20" rx="1.5" fill="#00ffaf"/>

  <!-- streaming row diffs from the replication slot -->
  <g transform="translate(508,288)">
    <rect class="cell c0" x="0"   y="0" width="15" height="15" rx="3" fill="#00ffaf"/>
    <rect class="cell c1" x="20"  y="0" width="15" height="15" rx="3" fill="#ff66c1"/>
    <rect class="cell c2" x="40"  y="0" width="15" height="15" rx="3" fill="#00ffaf"/>
    <rect class="cell c3" x="60"  y="0" width="15" height="15" rx="3" fill="#ff66c1"/>
    <rect class="cell c4" x="80"  y="0" width="15" height="15" rx="3" fill="#00ffaf"/>
    <rect class="cell c5" x="100" y="0" width="15" height="15" rx="3" fill="#ff5e3a"/>
    <rect class="cell c6" x="120" y="0" width="15" height="15" rx="3" fill="#00ffaf"/>
    <rect class="cell c7" x="140" y="0" width="15" height="15" rx="3" fill="#ff66c1"/>
    <rect class="cell c8" x="160" y="0" width="15" height="15" rx="3" fill="#00ffaf"/>
    <rect class="cell c9" x="180" y="0" width="15" height="15" rx="3" fill="#ff5e3a"/>
  </g>

  <rect width="1200" height="340" fill="url(#vignette)"/>
</svg>
