[package]
name = "palimpsest-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Real-Postgres conformance harness for Palimpsest (nightly only, opt-in)."
publish = false

# This crate is **opt-in**. The default build is empty so workspace
# `cargo build` / `cargo test` do not require a running Postgres.
# Enable with `--features real-postgres` (also requires
# `PALIMPSEST_PG_URL` to be set at test-time).
[features]
default = []
real-postgres = ["dep:tokio", "dep:tokio-postgres", "dep:bytes", "dep:futures", "dep:serde_json"]

[dependencies]
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["runtime"] }

[dev-dependencies]
palimpsest-dataflow = { path = "../palimpsest-dataflow" }
palimpsest-permissions = { path = "../palimpsest-permissions" }
palimpsest-server = { path = "../palimpsest-server" }
palimpsest-sql = { path = "../palimpsest-sql" }
palimpsest-test-harness = { path = "../palimpsest-test-harness" }
palimpsest-wal = { path = "../palimpsest-wal" }
serde_json = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true
