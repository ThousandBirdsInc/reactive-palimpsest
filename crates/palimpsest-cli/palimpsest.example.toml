# Example palimpsest-cli configuration. Copy to `palimpsest.toml`
# (or pass as the first CLI argument) and adapt as needed.

[grpc]
addr = "0.0.0.0:50051"

[metrics]
addr = "127.0.0.1:9090"

[auth]
kind = "anonymous"
# kind = "jwt"
# secret = "super-secret"
# issuer = "palimpsest"
# audience = "clients"
# [auth.claim_to_field]
# sub = "id"
# org = "org_id"

# Field types: bool, int, float, text, timestamp, uuid, jsonb, enum.
[permissions.user_schema]
# id = "int"
# tenant_id = "uuid"

# [[permissions.rules]]
# name = "posts_owner"
# table = "posts"
# mode = "both"
# predicate = "author_id = $user.id"

# Named prepared queries (docs/NAMED-QUERIES.md): sqlc-format query
# files registered at startup. Registration failures abort startup with
# the query name and the exact rejected construct. Configuring any file
# disables raw-SQL subscribes (clients must subscribe by query name)
# unless `inline_sql = true`. Paths resolve relative to this file.
# [queries]
# files = ["queries.sql"]
# inline_sql = false

# Optional upstream Postgres connection. Required for `slot-info` and
# (later) for the real WAL runtime.
# [upstream]
# url = "postgres://palimpsest:secret@localhost:5432/app"
# slot_name = "palimpsest"
# publication = "palimpsest_pub"
