[package]
name = "palimpsest-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standalone CLI that runs the embedded Palimpsest server."
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "palimpsest"
path = "src/main.rs"

[features]
default = []
# `slot-info` is always built in now; the feature is kept as a no-op so
# existing `--features slot-info` invocations keep working.
slot-info = []

[dependencies]
palimpsest-permissions = { path = "../palimpsest-permissions", version = "0.1.1" }
palimpsest-postgres = { path = "../palimpsest-postgres", version = "0.1.1" }
palimpsest-server = { path = "../palimpsest-server", version = "0.1.1" }
palimpsest-sql = { path = "../palimpsest-sql", version = "0.1.1" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres.workspace = true
toml.workspace = true
tracing.workspace = true

[lints]
workspace = true
