[package]
name = "palimpsest-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Subscription router and embeddable Palimpsest server."
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Optional: forward `tracing` spans to an OTLP collector. When enabled,
# `tracing_setup::install` chains an `tracing_opentelemetry` layer that
# reads `OTEL_EXPORTER_OTLP_ENDPOINT` (and the rest of the standard OTel
# env). Disabled by default to keep the dependency surface minimal.
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bincode.workspace = true
futures.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
opentelemetry = { version = "0.27", optional = true }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }
palimpsest-dataflow = { path = "../palimpsest-dataflow", version = "0.1.1" }
palimpsest-permissions = { path = "../palimpsest-permissions", version = "0.1.1" }
palimpsest-proto = { path = "../palimpsest-proto", version = "0.1.1" }
palimpsest-sql = { path = "../palimpsest-sql", version = "0.1.1" }
palimpsest-wal = { path = "../palimpsest-wal", version = "0.1.1" }
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-web.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.28", optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
jsonwebtoken.workspace = true
palimpsest-proto = { path = "../palimpsest-proto", version = "0.1.1" }
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tonic.workspace = true
tonic-health.workspace = true

[[bench]]
name = "commit_to_client"
harness = false

[lints]
workspace = true
