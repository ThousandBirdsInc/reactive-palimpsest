[package]
name = "palimpsest-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Generated protobuf and gRPC types for Palimpsest."
keywords.workspace = true
categories.workspace = true

[dependencies]
prost.workspace = true
# `serde` only provides the optional `Serialize`/`Deserialize` derives
# on `WireDatum`; the row payload itself is encoded by the hand-written
# codec in `wire.rs` (bincode-1.x byte layout, no serde at runtime), so
# the wasm client can leave serde + bincode out of the bundle.
serde = { workspace = true, optional = true }
thiserror.workspace = true

# `tonic` is native-only: on wasm32 `build.rs` emits the prost message
# types without the gRPC service stubs, so the browser bundle carries no
# tonic/http/tower code at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true }

[dev-dependencies]
# Golden reference for the manual row codec: the equivalence tests in
# `wire.rs` check every encoding against `bincode::serialize` /
# `bincode::deserialize` of the serde derives.
bincode.workspace = true

[build-dependencies]
tonic-build.workspace = true

[features]
default = ["serde"]
# `Serialize`/`Deserialize` impls for `WireDatum`.
serde = ["dep:serde"]

[lints]
workspace = true
