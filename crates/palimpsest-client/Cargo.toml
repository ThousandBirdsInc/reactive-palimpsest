[package]
name = "palimpsest-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native and WASM Rust client for the Palimpsest sync engine."
keywords.workspace = true
categories.workspace = true

[dependencies]
# Only the `Stream` trait (for `Subscription`); the full `futures`
# facade is not needed on either target.
futures-core = "0.3"
# `default-features = false` leaves out the serde derives on
# `WireDatum` (the row codec is hand-written); enable
# `palimpsest-proto/serde` directly if you need them.
palimpsest-proto = { path = "../palimpsest-proto", version = "0.1.1", default-features = false }
thiserror.workspace = true
# Optional so the browser bundle can leave it out: nothing in a browser
# installs a subscriber, and the callsite registry + `Debug` formatting
# tracing links were pure dead weight there. See `src/log.rs`.
tracing = { workspace = true, optional = true }

# `tokio::sync` and `tokio::select!` are runtime-agnostic, so they
# stay in the cross-target dep list. Anything that needs an actual
# runtime (`rt`, `time`) goes in the per-target sections below.
# We declare tokio directly (not via workspace inheritance) because
# the wasm target needs `default-features = false` and Cargo refuses
# to override default-features on a workspace dep that didn't set it.
tokio = { version = "1.40", default-features = false, features = ["macros", "sync"] }
tokio-stream = { version = "0.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.40", default-features = false, features = ["macros", "rt", "sync", "time"] }
tonic = { workspace = true }

# No `tonic` here: the browser transport is a WebSocket carrying
# prost-encoded frames, and the one thing the manager needed from tonic
# (`Status`) is a two-field struct in `src/status.rs` on this target.
# The socket is driven through `web-sys` directly (see `transport.rs`)
# so no WebSocket framework crate — and nothing it would pull in — is
# linked into the browser bundle.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
prost = "0.13"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "MessageEvent", "WebSocket"] }

# Native-only — these pull tokio with `rt-multi-thread`, axum, hyper,
# etc., none of which compile for `wasm32-unknown-unknown`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
jsonwebtoken.workspace = true
palimpsest-server = { path = "../palimpsest-server", version = "0.1.1" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["tracing"]
# Emit `tracing` events from the connection manager and local replica.
# Disable (`default-features = false`) to drop `tracing-core` from a
# wasm bundle that never installs a subscriber.
tracing = ["dep:tracing"]

[lints]
workspace = true
