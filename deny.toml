[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # `webpki-roots` ships Mozilla's CA bundle under the Community Data
    # License Agreement (permissive variant). It is a data license with
    # no copyleft or attribution obligations on our binaries; it appears
    # because rustls pulls the trust anchors in.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[advisories]
version = 2
# Vulnerabilities and yanked crates are hard failures; the CI job
# (`.github/workflows/ci.yml::deny`) blocks merges on either.
yanked = "deny"
# Documented, justified exceptions only. Each entry below is an
# *unmaintained* advisory (informational; not a vulnerability) for which no
# safe upgrade exists. Revisit when an upstream replacement lands.
#
# `.cargo/audit.toml` carries the same list for the weekly `cargo audit`
# job, plus `RUSTSEC-2022-0054` (`wee_alloc`): cargo-audit scans the raw
# lockfile, while cargo-deny resolves features first and never sees that
# opt-in dependency.
ignore = [
    # `paste` (proc-macro) archived by its author. Transitive via
    # columnation -> timely (dataflow). No drop-in replacement adopted upstream.
    "RUSTSEC-2024-0436",
    # `bincode` 1.x unmaintained advisory. Transitive only.
    "RUSTSEC-2025-0141",
    # `memmap` unmaintained. Transitive via the dataflow/timely stack.
    "RUSTSEC-2020-0077",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path without a version req;
# cargo-deny treats those as wildcards. They are first-party path deps, not
# registry wildcards, so allow them while still denying registry `*` deps.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
