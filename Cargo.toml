[workspace]
members = [
    "crates/palimpsest-proto",
    "crates/palimpsest-sql",
    "crates/palimpsest-test-harness",
    "crates/palimpsest-wal",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82.0"
authors = ["colton@thousandbirds.ai"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/thousandbirds/palimpsest"
homepage = "https://github.com/thousandbirds/palimpsest"
description = "A Postgres WAL-backed live query sync engine."
keywords = ["postgres", "wal", "sync", "dataflow", "grpc"]
categories = ["database", "network-programming", "wasm"]

[workspace.dependencies]
bincode = "1.3"
bytes = "1.7"
differential-dataflow = "0.13"
futures = "0.3"
insta = "1.40"
petgraph = "0.7"
prost = "0.13"
prost-build = "0.13"
proptest = "1.5"
serde = { version = "1.0", features = ["derive"] }
smallvec = "1.13"
sqlparser = "0.52"
thiserror = "2.0"
timely = "0.24"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
tonic-web = "0.12"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
