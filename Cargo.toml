[workspace]
members = [
    "crates/palimpsest-cli",
    "crates/palimpsest-client",
    "crates/palimpsest-client-js",
    "crates/palimpsest-conformance",
    "crates/palimpsest-dataflow",
    "crates/palimpsest-integration-tests",
    "crates/palimpsest-permissions",
    "crates/palimpsest-properties",
    "crates/palimpsest-proto",
    "crates/palimpsest-server",
    "crates/palimpsest-soak",
    "crates/palimpsest-sql",
    "crates/palimpsest-test-harness",
    "crates/palimpsest-wal",
    "xtask",
]
# Standalone crates with their own dependency closures; deliberately
# not part of the main workspace so `cargo build --workspace` stays
# focused on the library + CLI surface.
exclude = ["examples/demo-app/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82.0"
authors = ["colton@thousandbirds.ai"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/thousandbirds/palimpsest"
homepage = "https://github.com/thousandbirds/palimpsest"
description = "A Postgres WAL-backed live query sync engine."
keywords = ["postgres", "wal", "sync", "dataflow", "grpc"]
categories = ["database", "network-programming", "wasm"]

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
bincode = "1.3"
bytes = "1.7"
futures = "0.3"
http = "1.1"
insta = "1.40"
jsonwebtoken = "9.3"
petgraph = "0.7"
prost = "0.13"
prost-build = "0.13"
proptest = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
sqlparser = "0.52"
thiserror = "2.0"
timely = "0.25"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = "0.12"
tonic-build = "0.12"
tonic-health = "0.12"
tonic-web = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

# Used by `xtask check-wasm-size` and the React example's build:
# squeeze the wasm bundle hard. `panic = "abort"` drops the panic
# unwinding tables, `lto = true` runs cross-crate inlining,
# `opt-level = "z"` prefers size over speed, and a single codegen unit
# unlocks the most aggressive whole-crate optimizations.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
