[workspace]
members = [
    "crates/palimpsest-cli",
    "crates/palimpsest-client",
    "crates/palimpsest-client-js",
    "crates/palimpsest-conformance",
    "crates/palimpsest-dataflow",
    "crates/palimpsest-integration-tests",
    "crates/palimpsest-permissions",
    "crates/palimpsest-postgres",
    "crates/palimpsest-properties",
    "crates/palimpsest-proto",
    "crates/palimpsest-server",
    "crates/palimpsest-soak",
    "crates/palimpsest-sql",
    "crates/palimpsest-test-harness",
    "crates/palimpsest-wal",
    "xtask",
]
# Standalone crates with their own dependency closures; deliberately
# not part of the main workspace so `cargo build --workspace` stays
# focused on the library + CLI surface.
exclude = ["examples/demo-app/server"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82.0"
authors = ["colton@thousandbirds.ai"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/thousandbirds/palimpsest"
homepage = "https://github.com/thousandbirds/palimpsest"
description = "A Postgres WAL-backed live query sync engine."
keywords = ["postgres", "wal", "sync", "dataflow", "grpc"]
categories = ["database", "network-programming", "wasm"]

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
bincode = "1.3"
bytes = "1.7"
futures = "0.3"
http = "1.1"
insta = "1.40"
jsonwebtoken = "9.3"
petgraph = "0.7"
prost = "0.13"
prost-build = "0.13"
proptest = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
sqlparser = "0.52"
thiserror = "2.0"
timely = "0.25"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = "0.12"
tonic-build = "0.12"
tonic-health = "0.12"
tonic-web = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# Stylistic pedantic/nursery lints that flag large, pre-existing surfaces
# (handler signatures, long request handlers, lock scopes, boxed futures) where
# mechanical rewrites would add churn and risk without improving correctness.
# Kept curated and explicit, like the allows above.
needless_pass_by_value = "allow"
too_many_lines = "allow"
significant_drop_tightening = "allow"
large_futures = "allow"
format_push_string = "allow"
option_if_let_else = "allow"
struct_field_names = "allow"
match_same_arms = "allow"
type_complexity = "allow"
unused_self = "allow"
unnecessary_wraps = "allow"
similar_names = "allow"
return_self_not_must_use = "allow"
assigning_clones = "allow"
# Numeric casts in cursor/LSN/offset arithmetic are intentional and bounded.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Misfires on shell/template strings containing `${var}` (e.g. node-agent's
# container bootstrap command), which are not Rust format strings.
literal_string_with_formatting_args = "allow"

# Used by `xtask check-wasm-size` and the React example's build:
# squeeze the wasm bundle hard. `panic = "abort"` drops the panic
# unwinding tables, `lto = true` runs cross-crate inlining,
# `opt-level = "z"` prefers size over speed, and a single codegen unit
# unlocks the most aggressive whole-crate optimizations.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
